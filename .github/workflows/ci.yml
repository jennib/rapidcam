name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    name: Type check & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Disable broken Microsoft repos
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list

      # The browser binary is ~150MB and identical for a given Playwright
      # version, so a hit skips the download entirely. Keyed on the version
      # resolved in the lockfile, NOT on the lockfile hash: any unrelated
      # dependency bump would otherwise throw the browser away.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      # Split from the browser download on purpose. `install --with-deps` shells
      # out to apt for Chromium's shared libraries, and that fetch is what hangs:
      # twice on 2026-08-17 it sat past 20 minutes on a step that normally takes
      # seconds, needing a cancel-and-rerun both times. On its own step it gets a
      # timeout and one retry, so a stuck mirror costs ~3 minutes and recovers
      # instead of wedging the job. The system libraries are NOT cached — they
      # install into the runner image, not into ~/.cache.
      # Best effort, and the timeout is INSIDE the step on purpose: a
      # `timeout-minutes:` kills the whole step, so an `||` fallback after it can
      # never run — which is useless here, because hanging IS the failure mode.
      # `timeout(1)` bounds each attempt instead, so the retry is reachable.
      #
      # Non-fatal because the ubuntu-latest image already ships most of what
      # Chromium needs; this step is topping up, not bootstrapping. If a library
      # really is missing, the E2E step fails immediately with a launch error —
      # a clear failure in seconds, rather than a 20-minute stall on an apt
      # mirror that has nothing to do with the code under test.
      - name: Install Playwright system deps (best effort)
        timeout-minutes: 8
        run: |
          for attempt in 1 2; do
            if timeout 150 npx playwright install-deps chromium; then
              echo "system deps ok (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt failed or timed out after 150s"
            sleep 10
          done
          echo "::warning::playwright install-deps did not complete; continuing. If Chromium is missing a shared library, the E2E step will fail with a launch error."

      # Cached above; on a hit this is a no-op that just verifies the binary.
      - name: Install Playwright browser
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npm run test:e2e
