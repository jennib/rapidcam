<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Export preview harness</title>
  <style>
    html, body { margin: 0; background: #1e1f24; }
    /* Minimal styling for the dialog classes the dialog builds. */
    .tp-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex;
      align-items: center; justify-content: center; z-index: 10; }
    .tp-dialog { background: #22242b; color: #e8e8ee; border-radius: 10px; padding: 14px; }
    .tp-dialog-body { padding: 8px 0; }
    .tp-dialog-footer { display: flex; justify-content: flex-end; gap: 8px; }
    .btn { padding: 6px 12px; border-radius: 6px; border: 1px solid #3a3c44;
      background: #2c2e36; color: #e8e8ee; cursor: pointer; }
  </style>
</head>
<body>
  <script type="module">
    import { openExportPreview } from "/src/ui/exportPreviewDialog.ts";

    window.__openPreview = (opts) => {
      window.__result = undefined;
      openExportPreview(opts).then((r) => { window.__result = r; });
      return true;
    };

    // Count backplot pixels that match the cut colour (#5aa0ff: blue dominant).
    window.__cutPixels = () => {
      const c = document.querySelector(".tp-dialog canvas");
      if (!c) return -1;
      const px = c.getContext("2d").getImageData(0, 0, c.width, c.height).data;
      let n = 0;
      for (let i = 0; i < px.length; i += 4) {
        if (px[i + 2] > 120 && px[i + 2] > px[i] + 30 && px[i + 2] > px[i + 1] + 10) n++;
      }
      return n;
    };

    window.__harnessReady = true;
  </script>
</body>
</html>
