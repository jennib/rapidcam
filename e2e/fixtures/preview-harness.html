<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WebGL preview harness</title>
  <style>
    html, body { margin: 0; background: #1e2024; }
    /* Fixed size → deterministic backing store for screenshot comparison. */
    #host { width: 640px; height: 480px; position: relative; }
  </style>
</head>
<body>
  <div id="host"></div>
  <script type="module">
    import { WebGLPreview } from "/src/cam/webglPreview.ts";

    // Build a synthetic height map with a rotated rectangular pocket (vertical
    // walls) plus a few diagonal grooves. The walls run at an angle to the raster
    // grid — the worst case for stair-stepping — so a regression that reintroduces
    // crenellation is plainly visible in the rendered frame.
    window.__renderPreview = (opts = {}) => {
      window.__err = ""; // clear any prior error so each render reports its own
      const { stockW = 120, stockH = 80, stockT = 12, angleDeg = 25, RES = 4 } = opts;
      // Rotary: wrap the same unrolled height map onto a cylinder. stockH is the
      // circumference, so diameter = stockH/π makes it close into a full tube.
      const rotary = opts.rotary
        ? { diameter: stockH / Math.PI, wrapAxis: opts.wrapAxis || "y" }
        : null;
      const gridW = Math.ceil(stockW * RES), gridH = Math.ceil(stockH * RES);
      const data = new Float32Array(gridW * gridH).fill(stockT);
      const cx = stockW / 2, cy = stockH / 2;
      const a = angleDeg * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);

      const carve = (hw, hh, depth) => {
        const floor = stockT - depth;
        for (let r = 0; r < gridH; r++) {
          for (let c = 0; c < gridW; c++) {
            const x = c / (gridW - 1) * stockW - cx;
            const y = r / (gridH - 1) * stockH - cy;
            const lx = x * ca + y * sa, ly = -x * sa + y * ca;
            if (Math.abs(lx) <= hw && Math.abs(ly) <= hh) {
              const i = r * gridW + c;
              if (floor < data[i]) data[i] = floor;
            }
          }
        }
      };
      if (opts.noCuts) {
        // Leave the stock uncut — a plain cylinder, used as the brightness
        // baseline for the mirror-orientation check below.
      } else if (opts.laser || opts.shallow) {
        // Stand-in for a greyscale laser engrave: SHALLOW surface removals in
        // four vertical bands of increasing "burn" depth (0.1 → 0.4 mm) across a
        // central horizontal strip. Rendered with laser shading these read as a
        // scorch→char gradient; the same field rendered as a mill (opts.shallow)
        // is the brightness baseline for the "burn is darker" check.
        const bands = [0.1, 0.2, 0.3, 0.4];
        for (let r = 0; r < gridH; r++) {
          for (let c = 0; c < gridW; c++) {
            const u = c / (gridW - 1), v = r / (gridH - 1);
            if (v >= 0.3 && v <= 0.7) {
              const bi = Math.min(bands.length - 1, Math.floor(u * bands.length));
              data[r * gridW + c] = stockT - bands[bi];
            }
          }
        }
      } else if (opts.mark) {
        // A single shallow (machined-bright) pocket at HIGH v — a band around
        // the circumference that, wrapped correctly, lands on the visible top of
        // the cylinder (θ ≈ 0). If the wrap is mirrored (v not flipped) it goes to
        // the hidden underside instead. So "is the cut visible from the default
        // view" distinguishes a correct wrap from a mirrored one — no screenshot
        // baseline needed (see preview.e2e.ts).
        for (let r = 0; r < gridH; r++) {
          for (let c = 0; c < gridW; c++) {
            const u = c / (gridW - 1), v = r / (gridH - 1);
            if (u >= 0.25 && u <= 0.75 && v >= 0.75 && v <= 0.95) data[r * gridW + c] = stockT - 3;
          }
        }
      } else {
        carve(34, 19, 6); // main pocket
        for (let r = 0; r < gridH; r++) {
          for (let c = 0; c < gridW; c++) {
            const x = c / (gridW - 1) * stockW - cx;
            const y = r / (gridH - 1) * stockH - cy;
            const lx = x * ca + y * sa, ly = -x * sa + y * ca;
            if (Math.abs(ly) < 15 && Math.abs(((lx + 60) % 12) - 6) < 1.2) {
              const i = r * gridW + c;
              data[i] = Math.min(data[i], stockT - 9); // engraved grooves
            }
          }
        }
      }

      const host = document.getElementById("host");
      host.style.display = ""; // re-show if a prior render hid it (multi-render tests)
      host.querySelectorAll("canvas,button,.webgl-status").forEach((n) => {
        n.remove();
      });
      try {
        const p = new WebGLPreview(host);
        p.render({ data, gridW, gridH, stockW, stockH, stockT, laser: !!opts.laser }, rotary);
        if (opts.pitch !== undefined) {
          p.pitch = opts.pitch;
          p.draw();
        }
        // Grab the frame *synchronously*, in the same task as the draw, so the
        // WebGL drawing buffer is still intact (the context has no
        // preserveDrawingBuffer, so it is cleared once we yield). Screenshotting
        // this static <img> is deterministic and immune to compositor timing.
        const canvas = host.querySelector("canvas");
        const url = canvas.toDataURL("image/png");
        // Mean red channel of the frame — a baseline-free brightness metric the
        // mirror-orientation test reads (a visible machined cut lifts it).
        try {
          const m = document.createElement("canvas");
          m.width = canvas.width; m.height = canvas.height;
          const mctx = m.getContext("2d");
          mctx.drawImage(canvas, 0, 0);
          window.__px = mctx.getImageData(0, 0, m.width, m.height).data;
        } catch (_e) { window.__px = null; }
        let img = document.getElementById("preview-shot");
        if (!img) {
          img = document.createElement("img");
          img.id = "preview-shot";
          img.style.cssText = "display:block;width:640px;height:480px;";
          document.body.appendChild(img);
        }
        host.style.display = "none";
        img.src = url;
        return true;
      } catch (e) {
        window.__err = String(e?.message || e);
        return false;
      }
    };

    window.__harnessReady = true;
  </script>
</body>
</html>
